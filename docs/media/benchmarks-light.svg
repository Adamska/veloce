<svg xmlns="http://www.w3.org/2000/svg" width="820" height="444" viewBox="0 0 820 444" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Veloce benchmark results">
  <title>Veloce benchmark results</title>
  <text x="0" y="24.0" font-size="16" font-weight="600" fill="#0b0b0b">Cold seek to the exact frame</text>
  <text x="820" y="24.0" font-size="15" font-weight="600" text-anchor="end" fill="#0b0b0b">6.5× faster</text>
  <text x="0" y="44.0" font-size="12.5" fill="#52514e">Median over random targets, H.264 1080p 24 fps, 10 s keyframe spacing. Lower is better.</text>
  <text x="138" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#0b0b0b">Earlier build</text>
  <path d="M150.0,60.0 H724.0 Q728.0,60.0 728.0,64.0 V78.0 Q728.0,82.0 724.0,82.0 H150.0 Z" fill="#898781"/>
  <text x="736.0" y="75.5" font-size="13" font-weight="400" fill="#0b0b0b">412 ms</text>
  <text x="138" y="107.5" font-size="13" text-anchor="end" font-weight="600" fill="#0b0b0b">Veloce</text>
  <path d="M150.0,92.0 H234.4 Q238.4,92.0 238.4,96.0 V110.0 Q238.4,114.0 234.4,114.0 H150.0 Z" fill="#1baf7a"/>
  <text x="246.4" y="107.5" font-size="13" font-weight="600" fill="#0b0b0b">63 ms</text>
  <line x1="150" y1="56.0" x2="150" y2="118.0" stroke="#c3c2b7" stroke-width="1"/>
  <text x="0" y="164.0" font-size="16" font-weight="600" fill="#0b0b0b">Rapid 5 s hops whose frame never appeared</text>
  <text x="820" y="164.0" font-size="15" font-weight="600" text-anchor="end" fill="#0b0b0b">72 to 1</text>
  <text x="0" y="184.0" font-size="12.5" fill="#52514e">80 presses (40 forward, 40 back), one every 90 ms. Lower is better.</text>
  <text x="138" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#0b0b0b">Earlier build</text>
  <path d="M150.0,200.0 H724.0 Q728.0,200.0 728.0,204.0 V218.0 Q728.0,222.0 724.0,222.0 H150.0 Z" fill="#898781"/>
  <text x="736.0" y="215.5" font-size="13" font-weight="400" fill="#0b0b0b">72 of 80</text>
  <text x="138" y="247.5" font-size="13" text-anchor="end" font-weight="600" fill="#0b0b0b">Veloce</text>
  <path d="M150.0,232.0 H154.0 Q158.0,232.0 158.0,236.0 V250.0 Q158.0,254.0 154.0,254.0 H150.0 Z" fill="#1baf7a"/>
  <text x="166.0" y="247.5" font-size="13" font-weight="600" fill="#0b0b0b">1 of 80</text>
  <line x1="150" y1="196.0" x2="150" y2="258.0" stroke="#c3c2b7" stroke-width="1"/>
  <text x="0" y="304.0" font-size="16" font-weight="600" fill="#0b0b0b">Decoding speed, H.264 1080p</text>
  <text x="820" y="304.0" font-size="15" font-weight="600" text-anchor="end" fill="#0b0b0b">9.4× faster</text>
  <text x="0" y="324.0" font-size="12.5" fill="#52514e">Frames per second available to fill the window. Higher is better.</text>
  <text x="138" y="355.5" font-size="13" text-anchor="end" font-weight="400" fill="#0b0b0b">VideoToolbox</text>
  <path d="M150.0,340.0 H207.8 Q211.8,340.0 211.8,344.0 V358.0 Q211.8,362.0 207.8,362.0 H150.0 Z" fill="#898781"/>
  <text x="219.8" y="355.5" font-size="13" font-weight="400" fill="#0b0b0b">210 fps</text>
  <text x="138" y="387.5" font-size="13" text-anchor="end" font-weight="600" fill="#0b0b0b">Software (chosen)</text>
  <path d="M150.0,372.0 H724.0 Q728.0,372.0 728.0,376.0 V390.0 Q728.0,394.0 724.0,394.0 H150.0 Z" fill="#1baf7a"/>
  <text x="736.0" y="387.5" font-size="13" font-weight="600" fill="#0b0b0b">1,965 fps</text>
  <line x1="150" y1="336.0" x2="150" y2="398.0" stroke="#c3c2b7" stroke-width="1"/>
  <text x="0" y="434.0" font-size="11.5" fill="#898781">Apple M1 Max, release build, examples/seek_bench.rs. Earlier build: hardware decoding forced, no speculative decoders.</text>
</svg>
